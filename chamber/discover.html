<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chamber Discover</title>
    <meta name="description" content="Discover places of interest in our region." />
    <meta name="author" content="Buyannemekh Chimeddorj" />

    <meta property="og:title" content="Chamber Discover" />
    <meta property="og:description" content="Top places and resources for visitors and delegates." />
    <meta property="og:image" content="images/hero-small.webp" />
    <meta property="og:url" content="https://username.github.io/wdd231/chamber/discover.html" />

    <link rel="stylesheet" href="styles/normalize.css" />
    <link rel="stylesheet" href="styles/small.css" />
    <link rel="stylesheet" href="styles/larger.css" />
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <img src="images/chamber-logo.webp" alt="Chamber logo" class="brand-logo" />
                <span class="brand-title">Chamber</span>
            </a>

            <button id="menu-toggle" aria-controls="nav-menu" aria-expanded="false" class="menu-toggle">☰</button>

            <nav id="nav-menu" class="nav" role="navigation">
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="directory.html">Directory</a></li>
                    <li><a href="discover.html" class="active">Discover</a></li>
                    <li><a href="join.html">Join</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container main discover-main-layout">
        <aside class="discover-sidebar card">
            <div id="visit-message" aria-live="polite"></div>
        </aside>

        <section class="discover-content">
            <h1>Discover the Region</h1>
            <p class="lead">A curated guide to logistics, venues, and services for visitors and members.</p>

            <div id="discover-items-grid" class="discover-grid">
                <!-- discover.js (module) will populate 8 cards here by importing data/discover.mjs -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-left">
                <p>Chamber of Commerce — <span class="muted">Regional Business Network</span></p>
                <p>Contact: info@chamber.example | +976 11 123 456</p>
            </div>
            <div class="footer-right">
                <p><span id="current-year"></span> • Your Name • WDD 231</p>
                <p>Last modified: <span id="last-modified-date"></span></p>
            </div>
        </div>
    </footer>

    <!-- Module script (ES module) imports data/discover.mjs -->
    <script type="module" src="scripts/discover.js"></script>
    <script src="scripts/main.js" defer></script>
</body>

</html>
